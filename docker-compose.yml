services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trail-app
    network_mode: host # Allows container to directly access host services (like MariaDB at 127.0.0.1)
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_FRESH_SEED=true # Set to 'true' if you want a complete reset & seed on start
      - DB_CONNECTION=sqlite

      # --- MariaDB / MySQL on your Linux host ---
    #   - DB_CONNECTION=mysql
    #   - DB_HOST=127.0.0.1
    #   - DB_PORT=3306
    #   - DB_DATABASE=cet_ticket_system
    #   - DB_USERNAME=root
    #   - DB_PASSWORD=root
    volumes:
      - ./storage:/var/www/storage
    restart: unless-stopped
